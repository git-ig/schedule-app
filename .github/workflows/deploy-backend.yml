name: Deploy Backend

on:
  workflow_run:
    workflows: ["Build and Analyze"]
    types:
      - completed
    branches:
      - main
      - dev

jobs:
  deploy-backend:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Set up Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ansible jq

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: echo -n "$ANSIBLE_VAULT_PASSWORD" > infra/ansible/.vault_pass

      - name: Run Ansible Lint
        working-directory: infra/ansible
        run: ansible-lint deploy.yml
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ./.vault_pass

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Create Terraform backend config
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        working-directory: infra/terraform/gcp
        run: |
          echo "bucket = \"$GCS_BUCKET_NAME\"" > backend.conf
          echo "prefix = \"terraform/state\"" >> backend.conf

      - name: Initialize Terraform
        working-directory: infra/terraform/gcp
        run: terraform init -backend-config=backend.conf

      - name: Generate SSH Key and Create tfvars
        id: ssh_and_tfvars
        run: |
          # --- SSH Key Generation ---
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          PUB_KEY_CONTENT=$(cat ~/.ssh/id_rsa.pub)

          # --- Create terraform.tfvars ---
          cat > infra/terraform/gcp/terraform.tfvars << EOF
          project_id               = "${{ secrets.GCP_PROJECT_ID }}"
          region                   = "${{ secrets.GCP_REGION }}"
          zone                     = "${{ secrets.GCP_ZONE }}"
          ssh_user                 = "${{ secrets.GCP_SSH_USER }}"
          ssh_public_key_content   = "$PUB_KEY_CONTENT"
          bucket_name              = "${{ secrets.GCS_BUCKET_NAME }}"
          EOF

          echo "--- tfvars created ---"
          cat infra/terraform/gcp/terraform.tfvars

      - name: Terraform Apply
        working-directory: infra/terraform/gcp
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: Setup SSH Agent and Config
        env:
          GCP_SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          # --- SSH Agent Setup ---
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # --- SSH Config Setup ---
          cd infra/terraform/gcp
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          cd ../../..

          cat > ~/.ssh/config << EOF
          Host bastion
            HostName $BASTION_IP
            User $GCP_SSH_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ForwardAgent yes

          Host 10.0.*.*
            User $GCP_SSH_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          echo "--- SSH Config Created ---"
          cat ~/.ssh/config
          echo "--------------------------"

          echo "--- Testing Connection to Bastion ---"
          ssh -o ConnectTimeout=30 bastion "echo 'SSH connection to bastion successful'"

      - name: Generate Ansible Inventory
        id: terraform_outputs
        working-directory: infra/terraform/gcp
        run: |
          # Получаем IPs
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          BACKEND_IP=$(terraform output -raw backend_private_ip)
          FRONTEND_IP=$(terraform output -raw frontend_private_ip)
          DATABASE_IP=$(terraform output -raw database_private_ip)
          MONITORING_IP=$(terraform output -raw monitoring_private_ip)
          SSH_USER="${{ secrets.GCP_SSH_USER }}"

          # Создаем директорию inventory если она не существует
          mkdir -p ../../ansible/inventory

          # Создаем инвентарь с правильной конфигурацией SSH
          cat > ../../ansible/inventory/gcp.yml << EOF
          ---
          all:
            vars:
              ansible_user: $SSH_USER
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
            children:
              bastion_group:
                hosts:
                  bastion_host:
                    ansible_host: $BASTION_IP
              private_instances:
                vars:
                  ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q $SSH_USER@$BASTION_IP -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
                children:
                  frontend_group:
                    hosts:
                      frontend_host:
                        ansible_host: $FRONTEND_IP
                  backend_group:
                    hosts:
                      backend_host:
                        ansible_host: $BACKEND_IP
                  database_group:
                    hosts:
                      database_host:
                        ansible_host: $DATABASE_IP
                  monitoring_group:
                    hosts:
                      monitoring_host:
                        ansible_host: $MONITORING_IP
          EOF

          echo "--- ANSIBLE INVENTORY CONTENT ---"
          cat ../../ansible/inventory/gcp.yml
          echo "---------------------------------"
          echo "backend_image=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Directory structure:"
          find . -type d -name "*ansible*" -o -name "*inventory*" | head -20
          echo "Full structure from root:"
          ls -la

      - name: Verify SSH Setup
        run: |
          echo "=== SSH Key Check ==="
          ls -la ~/.ssh/
          echo "=== SSH Config ==="
          cat ~/.ssh/config || echo "No SSH config found"
          echo "=== Testing SSH to Bastion ==="
          cd infra/terraform/gcp
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ secrets.GCP_SSH_USER }}@$BASTION_IP "echo 'Bastion connection successful'"

      - name: Run Backend Playbook
        working-directory: infra/ansible
        env:
          ANSIBLE_REMOTE_USER: ${{ secrets.GCP_SSH_USER }}
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          # Устанавливаем Docker коллекцию
          ansible-galaxy collection install community.docker

          # Настраиваем SSH Agent заново
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # Проверяем SSH agent
          echo "=== SSH Agent Status ==="
          ssh-add -l

          # Проверяем inventory
          echo "=== Inventory Check ==="
          ansible-inventory -i ./inventory/gcp.yml --list

          # Проверяем доступность bastion
          echo "=== Testing Bastion Connection ==="
          ansible bastion_group -i ./inventory/gcp.yml -m ping -vv

          # Тестируем подключение к backend через bastion
          echo "=== Testing Backend Connection ==="
          ansible backend_group -i ./inventory/gcp.yml -m ping -vv

          # Запускаем playbook только для backend
          echo "=== Running Backend Playbook ==="
          ansible-playbook deploy.yml --tags backend \
            --vault-password-file .vault_pass \
            --extra-vars "backend_image_url=${{ steps.terraform_outputs.outputs.backend_image }}" \
            --limit backend_group \
            -i ./inventory/gcp.yml \
            -vv
