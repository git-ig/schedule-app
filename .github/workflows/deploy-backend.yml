name: Deploy Backend

on:
  workflow_run:
    workflows: ["Build and Analyze"]
    types:
      - completed
    branches:
      - main
      - dev

jobs:
  deploy-backend:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Set up Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ansible jq

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: echo -n "$ANSIBLE_VAULT_PASSWORD" > infra/ansible/.vault_pass

      - name: Run Ansible Lint
        working-directory: infra/ansible
        run: ansible-lint deploy.yml
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ./.vault_pass

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup SSH Agent for Ansible
        env:
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GCP_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: echo -n "$ANSIBLE_VAULT_PASSWORD" > infra/ansible/.vault_pass

      - name: Create Terraform backend config
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        working-directory: infra/terraform/gcp
        run: |
          echo "bucket = \"$GCS_BUCKET_NAME\"" > backend.conf
          echo "prefix = \"terraform/state\"" >> backend.conf

      - name: Initialize Terraform
        working-directory: infra/terraform/gcp
        run: terraform init -backend-config=backend.conf

      - name: Create terraform.tfvars file
        working-directory: infra/terraform/gcp
        run: |
          echo 'project_id            = "${{ secrets.GCP_PROJECT_ID }}"'      > terraform.tfvars
          echo 'region                = "${{ secrets.GCP_REGION }}"'          >> terraform.tfvars
          echo 'zone                  = "${{ secrets.GCP_ZONE }}"'              >> terraform.tfvars
          echo 'ssh_user              = "${{ secrets.GCP_SSH_USER }}"'          >> terraform.tfvars
          echo 'ssh_public_key_path   = "/home/runner/.ssh/id_rsa.pub"'       >> terraform.tfvars
          echo 'bucket_name           = "${{ secrets.GCS_BUCKET_NAME }}"'      >> terraform.tfvars

      - name: Terraform Apply
        working-directory: infra/terraform/gcp
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: Debug Terraform outputs
        working-directory: infra/terraform/gcp
        run: |
          echo "=== Terraform State ==="
          /usr/bin/terraform show -json | jq '.values.outputs // {}'

          echo "=== Available Outputs ==="
          /usr/bin/terraform output

          echo "=== Ansible Inventory Output ==="
          /usr/bin/terraform output ansible_inventory || echo "ansible_inventory output not found"

      - name: Generate Ansible inventory
        id: terraform_outputs
        working-directory: infra/terraform/gcp
        run: |
          mkdir -p ../../ansible/inventory

          # Используем системный terraform напрямую
          /usr/bin/terraform output -json ansible_inventory | jq -r '.value' > ../../ansible/inventory/gcp.yml

          echo "--- ANSIBLE INVENTORY CONTENT ---"
          cat ../../ansible/inventory/gcp.yml
          echo "---------------------------------"

          # Проверяем содержимое инвентаря
          if [ -s ../../ansible/inventory/gcp.yml ]; then
            echo "Inventory file created successfully"
            ansible-inventory -i ../../ansible/inventory/gcp.yml --list
          else
            echo "ERROR: Inventory file is empty"
            exit 1
          fi

          echo "backend_image=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Run Backend Playbook
        working-directory: infra/ansible
        run: |
          # Проверяем, что inventory содержит хосты
          if ! ansible-inventory -i ./inventory/gcp.yml --list | jq -e '.backend.hosts // empty' > /dev/null; then
            echo "ERROR: No backend hosts found in inventory"
            exit 1
          fi

          # Запускаем playbook
          ansible-playbook deploy.yml --tags backend \
            --vault-password-file .vault_pass \
            --extra-vars "backend_image_url=${{ steps.terraform_outputs.outputs.backend_image }}" \
            -vv
