name: Build and Analyze

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('''**/*.gradle*''', '''**/gradle-wrapper.properties''') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar -x test --info

      - name: Find and rename artifact
        run: |
          artifact_path=$(find build/libs -name "*.war" | head -n 1)
          if [ -z "$artifact_path" ]; then
            echo "::error::WAR file not found!"
            exit 1
          fi
          mv "$artifact_path" "build/libs/ROOT.war"
          echo "Artifact renamed to ROOT.war"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROOT.war
          path: build/libs/ROOT.war