---
- name: Deploy application services
  hosts: all
  roles:
    - common
  tags:
    - always

- name: Deploy backend
  hosts: backend_group
  roles:
    - common
    - backend
  tags: backend

- name: Deploy frontend
  hosts: frontend_group
  roles:
    - frontend
  tags: frontend

- name: Deploy database
  hosts: database_group
  roles:
    - role: database
  vars_files:
    - group_vars/database/vault.yml
  tags: database

- name: Deploy monitoring
  hosts: monitoring_group
  roles:
    - monitoring
  tags: monitoring
