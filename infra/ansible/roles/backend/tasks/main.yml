---
# Tasks for backend deployment
- name: Create backend directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/backend" # Используем переменную
    state: directory
    mode: "0755"

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Debug Docker status
  debug:
    msg: "Docker check result: {{ docker_check.rc }}"

- name: Fail if Docker is not available
  fail:
    msg: "Docker is not installed. Make sure the common role runs first."
  when: docker_check.rc != 0

- name: Pull backend image
  community.docker.docker_image:
    name: "{{ backend_image_url }}"
    source: pull
    force_source: yes
  become: true

- name: Stop existing backend container
  community.docker.docker_container:
    name: backend
    state: absent
  become: true
  ignore_errors: true

- name: Run backend container
  community.docker.docker_container:
    name: backend
    image: "{{ backend_image_url }}"
    state: started
    restart_policy: always
    ports:
      - "8080:8080"
    env:
      NODE_ENV: production
  become: true
