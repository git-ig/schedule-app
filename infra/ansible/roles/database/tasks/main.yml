---
# Tasks for database deployment
- name: Create database directory
  ansible.builtin.file:
    path: /home/ig/database
    state: directory
    mode: '0755'

- name: Pull and run database container
  community.docker.docker_container:
    name: database
    image: postgres:13
    state: started
    restart_policy: always
    env:
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
    volumes:
      - /home/ig/database/data:/var/lib/postgresql/data
