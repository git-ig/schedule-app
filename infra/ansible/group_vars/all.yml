---
# Ports
backend_port: 8080
frontend_port: 80
database_port: 5432
redis_port: 6379

# Dynamic URL (use inventory vars)
backend_api_url: "http://{{ hostvars['backend_host']['ansible_host'] }}:{{ backend_port }}/"
database_url: "{{ hostvars['database_host']['ansible_host'] }}:{{ database_port }}"
redis_url: "{{ hostvars['database_host']['ansible_host'] }}:{{ redis_port }}"

# env config
app_environment: production
log_level: info
